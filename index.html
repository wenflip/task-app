<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tickr</title>
<style>
:root {
  --bg: #121212;
  --sidebar: #1e1e1e;
  --border: #333;
  --text: #e0e0e0;
  --muted: #aaa;
  --primary: #4da3ff;
  --danger: #ff6b6b;
  --success: #51cf66;
  --today: #4dabf7;
  --overdue: #ff6b6b;
  --shadow: 0 1px 3px rgba(0,0,0,.4);
  --card: #252525;
  --hover: #2a2a2a;
}
* { box-sizing: border-box; }
body { margin: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }
.app { display: flex; height: 100vh; }
.sidebar { width: 260px; background: var(--sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
.sidebar-header { padding: 16px; border-bottom: 1px solid var(--border); font-weight: 600; font-size: 1.2rem; }
.folders { flex: 1; overflow-y: auto; padding: 8px; }
.folder { padding: 10px 12px; margin: 2px 0; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; }
.folder:hover { background: var(--hover); }
.folder.active { background: #1a3a5c; color: var(--primary); font-weight: 500; }
.sidebar-actions { padding: 12px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
button { padding: 8px 12px; border: 1px solid var(--border); background: var(--card); color: var(--text); border-radius: 6px; cursor: pointer; font-size: 0.9rem; }
button.primary { background: var(--primary); color: #111; border-color: var(--primary); font-weight: 500; }
button.danger { color: var(--danger); }
button.small { padding: 4px 8px; font-size: 0.8rem; }
button:hover { opacity: 0.85; }
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.toolbar { padding: 12px 16px; background: var(--sidebar); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.toolbar h2 { margin: 0; font-size: 1.2rem; flex: 1; min-width: 120px; }
.filters { display: flex; gap: 4px; }
.filters button { padding: 6px 12px; }
.filters button.active { background: var(--primary); color: #111; border-color: var(--primary); }
.content { flex: 1; overflow-y: auto; padding: 16px; }
.list-section { background: var(--card); border-radius: 8px; margin-bottom: 12px; box-shadow: var(--shadow); overflow: hidden; }
.list-header { padding: 12px 16px; background: #2a2a2a; cursor: pointer; display: flex; align-items: center; gap: 8px; font-weight: 500; user-select: none; }
.list-header:hover { background: #333; }
.list-header .chevron { transition: transform .2s; }
.list-header.collapsed .chevron { transform: rotate(-90deg); }
.list-actions { margin-left: auto; display: flex; gap: 4px; }
.tasks { padding: 4px 0; }
.task { padding: 8px 16px 8px 32px; display: flex; align-items: flex-start; gap: 10px; border-bottom: 1px solid #333; }
.task:last-child { border-bottom: none; }
.task.subtask { padding-left: 56px; background: #1f1f1f; }
.task.subtask.subtask { padding-left: 80px; }
.checkbox { width: 18px; height: 18px; margin-top: 2px; cursor: pointer; flex-shrink: 0; }
.task-body { flex: 1; }
.task-title { font-weight: 500; }
.task-meta { font-size: 0.8rem; color: var(--muted); margin-top: 2px; display: flex; gap: 8px; align-items: center; }
.due { padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; }
.due.today { background: #1a3a5c; color: #4dabf7; }
.due.tomorrow { background: #1e3a2f; color: #51cf66; }
.due.overdue { background: #4a1e1e; color: #ff6b6b; }
.notes { margin-top: 6px; font-size: 0.85rem; color: #ccc; white-space: pre-wrap; background: #1a1a1a; padding: 8px; border-radius: 4px; }
.task-actions { margin-left: auto; display: flex; gap: 4px; opacity: 0.6; }
.task:hover .task-actions { opacity: 1; }
.empty { text-align: center; color: var(--muted); padding: 60px 20px; }
.empty h3 { margin-bottom: 8px; }
.modal { position: fixed; inset: 0; background: rgba(0,0,0,.7); display: flex; align-items: center; justify-content: center; z-index: 100; }
.modal-content { background: var(--card); padding: 20px; border-radius: 8px; width: 90%; max-width: 400px; border: 1px solid var(--border); }
.modal-content h3 { margin-top: 0; }
.modal-content input, .modal-content select, .modal-content textarea { width: 100%; padding: 8px; margin: 8px 0; background: #1a1a1a; border: 1px solid var(--border); color: var(--text); border-radius: 4px; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="sidebar-header">Tickr</div>
    <div class="folders" id="folders"></div>
    <div class="sidebar-actions">
      <button id="newFolderBtn">+ New Folder</button>
      <button id="importBtn" class="primary">Import TickTick CSV</button>
      <button id="exportBtn">Export to CSV</button>
      <button id="clearBtn" class="danger">Clear All Data</button>
      <input type="file" id="fileInput" accept=".csv" style="display:none">
    </div>
  </aside>
  <main class="main">
    <div class="toolbar">
      <h2 id="currentFolder">No folder selected</h2>
      <div class="filters">
        <button data-filter="all" class="active">All</button>
        <button data-filter="today">Today</button>
        <button data-filter="tomorrow">Tomorrow</button>
        <button data-filter="overdue">Overdue</button>
      </div>
      <select id="sortSelect">
        <option value="date">Sort by Date</option>
        <option value="alpha">Sort Alphabetically</option>
      </select>
      <button id="newListBtn">+ New List</button>
    </div>
    <div class="content" id="content"></div>
  </main>
</div>

<div id="modal" class="modal" style="display:none">
  <div class="modal-content">
    <h3 id="modalTitle">New</h3>
    <div id="modalBody"></div>
    <div class="modal-actions">
      <button id="modalCancel">Cancel</button>
      <button id="modalOk" class="primary">OK</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'tickr-v1';

let state = {
  folders: [],
  currentFolderId: null,
  filter: 'all',
  sort: 'date',
  expandedLists: {}
};

const API = '/api/state';
let useApi = true;

async function load() {
  try {
    const res = await fetch(API);
    if (res.ok) {
      const data = await res.json();
      if (data && data.folders) {
        state = { ...state, ...data };
        useApi = true;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); // cache
        return;
      }
    }
  } catch (e) { console.warn('API load failed, falling back to local', e); }
  // fallback
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) state = { ...state, ...JSON.parse(raw) };
  } catch (e) {}
  useApi = false;
  if (!state.expandedLists) state.expandedLists = {};
}

async function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  if (useApi) {
    try {
      await fetch(API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(state)
      });
    } catch (e) { console.warn('API save failed', e); }
  }
}

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

function parseCSV(text) {
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const rows = [];
  let row = [];
  let field = '';
  let inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    const next = text[i + 1];
    if (inQuotes) {
      if (c === '"' && next === '"') { field += '"'; i++; }
      else if (c === '"') inQuotes = false;
      else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\n' || (c === '\r' && next === '\n')) {
        row.push(field);
        if (row.some(f => f.trim() !== '')) rows.push(row);
        row = []; field = '';
        if (c === '\r') i++;
      } else if (c !== '\r') field += c;
    }
  }
  if (field || row.length) {
    row.push(field);
    if (row.some(f => f.trim() !== '')) rows.push(row);
  }
  return rows;
}

function findHeaderIndex(rows) {
  for (let i = 0; i < Math.min(rows.length, 15); i++) {
    const r = rows[i];
    if (r && r[0] === 'Folder Name' && r.includes('List Name') && r.includes('Title')) return i;
  }
  return -1;
}

function importTickTick(csvText) {
  const rows = parseCSV(csvText);
  const headerIdx = findHeaderIndex(rows);
  if (headerIdx === -1) {
    alert('Could not find TickTick header. Is this a valid TickTick backup CSV?');
    return;
  }
  const headers = rows[headerIdx];
  const dataRows = rows.slice(headerIdx + 1);
  const col = (name) => headers.indexOf(name);
  const folderCol = col('Folder Name');
  const listCol = col('List Name');
  const titleCol = col('Title');
  const contentCol = col('Content');
  const dueCol = col('Due Date');
  const statusCol = col('Status');
  const taskIdCol = col('taskId');
  const parentIdCol = col('parentId');

  const tasksById = new Map();
  const openTasks = [];

  for (const row of dataRows) {
    if (row.length < headers.length) continue;
    const status = (row[statusCol] || '').trim();
    if (status !== '0' && status !== '') continue;
    const taskId = (row[taskIdCol] || '').trim();
    const parentId = (row[parentIdCol] || '').trim();
    const title = (row[titleCol] || '').trim();
    if (!title) continue;
    const dueRaw = (row[dueCol] || '').trim();
    let dueDate = null;
    if (dueRaw) {
      const d = dueRaw.split('T')[0];
      if (/^\d{4}-\d{2}-\d{2}$/.test(d)) dueDate = d;
    }
    const task = {
      id: taskId || uid(),
      title,
      dueDate,
      content: (row[contentCol] || '').trim(),
      subtasks: [],
      folderName: (row[folderCol] || '').trim() || 'No Folder',
      listName: (row[listCol] || '').trim() || 'Inbox',
      parentId: parentId || null
    };
    tasksById.set(task.id, task);
    openTasks.push(task);
  }

  const roots = [];
  for (const task of openTasks) {
    if (task.parentId && tasksById.has(task.parentId)) {
      tasksById.get(task.parentId).subtasks.push(task);
    } else {
      roots.push(task);
    }
  }

  const folderMap = new Map();
  for (const task of roots) {
    const fName = task.folderName;
    const lName = task.listName;
    if (!folderMap.has(fName)) folderMap.set(fName, { id: uid(), name: fName, lists: new Map() });
    const folder = folderMap.get(fName);
    if (!folder.lists.has(lName)) folder.lists.set(lName, { id: uid(), name: lName, tasks: [] });
    folder.lists.get(lName).tasks.push(task);
  }

  state.folders = Array.from(folderMap.values()).map(f => ({
    id: f.id,
    name: f.name,
    lists: Array.from(f.lists.values())
  }));
  state.folders.sort((a, b) => a.name.localeCompare(b.name));
  state.folders.forEach(f => f.lists.sort((a, b) => a.name.localeCompare(b.name)));
  state.currentFolderId = state.folders[0]?.id || null;
  state.expandedLists = {};
  save();
  render();
  alert(`Imported ${openTasks.length} open tasks into ${state.folders.length} folders.`);
}

function exportCSV() {
  const lines = [['Folder', 'List', 'Title', 'Due Date', 'Content', 'Is Subtask', 'Parent Title']];
  function walk(task, folderName, listName, parentTitle, isSub) {
    lines.push([folderName, listName, task.title, task.dueDate || '', (task.content || '').replace(/\n/g, ' '), isSub ? 'yes' : '', parentTitle || '']);
    for (const sub of task.subtasks || []) walk(sub, folderName, listName, task.title, true);
  }
  for (const folder of state.folders) {
    for (const list of folder.lists) {
      for (const task of list.tasks) walk(task, folder.name, list.name, '', false);
    }
  }
  const csv = lines.map(row => row.map(cell => {
    const s = String(cell ?? '');
    return (s.includes(',') || s.includes('"') || s.includes('\n')) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }).join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'tickr-export.csv';
  a.click();
  URL.revokeObjectURL(url);
}

function todayStr() { return new Date().toISOString().slice(0, 10); }
function tomorrowStr() {
  const d = new Date(); d.setDate(d.getDate() + 1); return d.toISOString().slice(0, 10);
}

function taskMatchesFilter(task) {
  if (state.filter === 'all') return true;
  if (!task.dueDate) return false;
  const today = todayStr();
  const tomorrow = tomorrowStr();
  if (state.filter === 'today') return task.dueDate === today;
  if (state.filter === 'tomorrow') return task.dueDate === tomorrow;
  if (state.filter === 'overdue') return task.dueDate < today;
  return true;
}

function hasMatchingTask(task) {
  if (taskMatchesFilter(task)) return true;
  return (task.subtasks || []).some(hasMatchingTask);
}

function sortTasks(tasks) {
  const arr = [...tasks];
  if (state.sort === 'alpha') arr.sort((a, b) => a.title.localeCompare(b.title));
  else arr.sort((a, b) => {
    if (!a.dueDate && !b.dueDate) return 0;
    if (!a.dueDate) return 1;
    if (!b.dueDate) return -1;
    return a.dueDate.localeCompare(b.dueDate);
  });
  return arr;
}

function findTask(taskId) {
  for (const folder of state.folders) {
    for (const list of folder.lists) {
      const found = findInTasks(list.tasks, taskId);
      if (found) return { task: found.task, list, folder, parentArray: found.parentArray };
    }
  }
  return null;
}
function findInTasks(tasks, id, parentArray = tasks) {
  for (let i = 0; i < tasks.length; i++) {
    if (tasks[i].id === id) return { task: tasks[i], parentArray, index: i };
    if (tasks[i].subtasks) {
      const sub = findInTasks(tasks[i].subtasks, id, tasks[i].subtasks);
      if (sub) return sub;
    }
  }
  return null;
}

function removeTask(taskId) {
  const loc = findTask(taskId);
  if (!loc) return;
  const idx = loc.parentArray.findIndex(t => t.id === taskId);
  if (idx !== -1) loc.parentArray.splice(idx, 1);
  save();
  render();
}

function showModal(title, bodyHtml, onOk) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = bodyHtml;
  document.getElementById('modal').style.display = 'flex';
  const ok = document.getElementById('modalOk');
  const cancel = document.getElementById('modalCancel');
  const close = () => { document.getElementById('modal').style.display = 'none'; };
  ok.onclick = () => { if (onOk()) close(); };
  cancel.onclick = close;
}

function createFolder() {
  showModal('New Folder', '<input id="mName" placeholder="Folder name" autofocus>', () => {
    const name = document.getElementById('mName').value.trim();
    if (!name) return false;
    state.folders.push({ id: uid(), name, lists: [] });
    state.folders.sort((a, b) => a.name.localeCompare(b.name));
    if (!state.currentFolderId) state.currentFolderId = state.folders[state.folders.length - 1].id;
    save(); render(); return true;
  });
}

function createList() {
  if (!state.currentFolderId) { alert('Select a folder first'); return; }
  showModal('New List', '<input id="mName" placeholder="List name" autofocus>', () => {
    const name = document.getElementById('mName').value.trim();
    if (!name) return false;
    const folder = state.folders.find(f => f.id === state.currentFolderId);
    folder.lists.push({ id: uid(), name, tasks: [] });
    folder.lists.sort((a, b) => a.name.localeCompare(b.name));
    save(); render(); return true;
  });
}

function createTask(listId) {
  showModal('New Task', `
    <input id="mTitle" placeholder="Task title" autofocus>
    <input id="mDue" type="date">
    <textarea id="mContent" placeholder="Notes (optional)" rows="3"></textarea>
  `, () => {
    const title = document.getElementById('mTitle').value.trim();
    if (!title) return false;
    const due = document.getElementById('mDue').value || null;
    const content = document.getElementById('mContent').value.trim();
    const folder = state.folders.find(f => f.id === state.currentFolderId);
    const list = folder.lists.find(l => l.id === listId);
    list.tasks.push({ id: uid(), title, dueDate: due, content, subtasks: [] });
    save(); render(); return true;
  });
}

function moveTask(taskId) {
  const loc = findTask(taskId);
  if (!loc) return;
  const options = state.folders.flatMap(f => f.lists.map(l => `<option value="${f.id}|${l.id}">${escapeHtml(f.name)} / ${escapeHtml(l.name)}</option>`)).join('');
  showModal('Move Task', `<select id="mTarget">${options}</select>`, () => {
    const val = document.getElementById('mTarget').value;
    const [fId, lId] = val.split('|');
    const targetFolder = state.folders.find(f => f.id === fId);
    const targetList = targetFolder.lists.find(l => l.id === lId);
    const idx = loc.parentArray.findIndex(t => t.id === taskId);
    const [task] = loc.parentArray.splice(idx, 1);
    targetList.tasks.push(task);
    save(); render(); return true;
  });
}

function moveList(listId) {
  const folder = state.folders.find(f => f.lists.some(l => l.id === listId));
  const list = folder.lists.find(l => l.id === listId);
  const options = state.folders.filter(f => f.id !== folder.id).map(f => `<option value="${f.id}">${escapeHtml(f.name)}</option>`).join('');
  if (!options) { alert('No other folders'); return; }
  showModal('Move List', `<select id="mTarget">${options}</select>`, () => {
    const fId = document.getElementById('mTarget').value;
    const target = state.folders.find(f => f.id === fId);
    const idx = folder.lists.findIndex(l => l.id === listId);
    const [moved] = folder.lists.splice(idx, 1);
    target.lists.push(moved);
    target.lists.sort((a, b) => a.name.localeCompare(b.name));
    save(); render(); return true;
  });
}

function deleteList(listId) {
  if (!confirm('Delete this list and all its tasks?')) return;
  const folder = state.folders.find(f => f.lists.some(l => l.id === listId));
  folder.lists = folder.lists.filter(l => l.id !== listId);
  save(); render();
}

function renderFolders() {
  const el = document.getElementById('folders');
  if (!state.folders.length) {
    el.innerHTML = '<div style="padding:12px;color:var(--muted);font-size:0.9rem">No folders yet.<br>Create one or import CSV.</div>';
    return;
  }
  el.innerHTML = state.folders.map(f => `
    <div class="folder ${f.id === state.currentFolderId ? 'active' : ''}" data-id="${f.id}">
      <span>${escapeHtml(f.name)}</span>
    </div>
  `).join('');
  el.querySelectorAll('.folder').forEach(div => {
    div.onclick = () => {
      state.currentFolderId = div.dataset.id;
      save(); render();
    };
  });
}

function dueClass(date) {
  if (!date) return '';
  const today = todayStr();
  const tomorrow = tomorrowStr();
  if (date < today) return 'overdue';
  if (date === today) return 'today';
  if (date === tomorrow) return 'tomorrow';
  return '';
}

function renderTask(task, depth = 0) {
  const show = depth > 0 || taskMatchesFilter(task) || (task.subtasks || []).some(s => hasMatchingTask(s));
  if (!show && state.filter !== 'all') return '';
  const due = task.dueDate ? `<span class="due ${dueClass(task.dueDate)}">${task.dueDate}</span>` : '';
  const notes = task.content ? `<div class="notes">${escapeHtml(task.content)}</div>` : '';
  const subHtml = (task.subtasks || []).map(s => renderTask(s, depth + 1)).join('');
  return `
    <div class="task ${depth > 0 ? 'subtask' : ''}">
      <input type="checkbox" class="checkbox" data-id="${task.id}">
      <div class="task-body">
        <div class="task-title">${escapeHtml(task.title)}</div>
        <div class="task-meta">${due}</div>
        ${notes}
        ${subHtml}
      </div>
      <div class="task-actions">
        <button class="small" data-move="${task.id}">Move</button>
        <button class="small danger" data-del="${task.id}">Del</button>
      </div>
    </div>
  `;
}

function renderMain() {
  const content = document.getElementById('content');
  const folder = state.folders.find(f => f.id === state.currentFolderId);
  document.getElementById('currentFolder').textContent = folder ? folder.name : 'No folder selected';
  if (!folder) {
    content.innerHTML = '<div class="empty"><h3>Select or create a folder</h3></div>';
    return;
  }
  let html = '';
  let anyVisible = false;
  for (const list of folder.lists) {
    const visibleTasks = list.tasks.filter(t => hasMatchingTask(t));
    if (visibleTasks.length === 0 && state.filter !== 'all') continue;
    anyVisible = true;
    const expanded = state.expandedLists[list.id] !== false;
    const sorted = sortTasks(visibleTasks.length ? visibleTasks : list.tasks);
    const tasksHtml = sorted.map(t => renderTask(t)).join('');
    html += `
      <div class="list-section">
        <div class="list-header ${expanded ? '' : 'collapsed'}" data-list="${list.id}">
          <span class="chevron">▼</span>
          ${escapeHtml(list.name)} <span style="color:var(--muted);font-weight:400;font-size:0.85rem">(${list.tasks.length})</span>
          <div class="list-actions">
            <button class="small" data-add="${list.id}">+ Task</button>
            <button class="small" data-movelist="${list.id}">Move</button>
            <button class="small danger" data-dellist="${list.id}">Del</button>
          </div>
        </div>
        <div class="tasks" style="${expanded ? '' : 'display:none'}">
          ${tasksHtml || '<div style="padding:12px 16px;color:var(--muted)">No tasks</div>'}
        </div>
      </div>
    `;
  }
  if (!anyVisible) html = '<div class="empty"><h3>No tasks match this filter</h3></div>';
  content.innerHTML = html;

  content.querySelectorAll('.list-header').forEach(h => {
    h.onclick = (e) => {
      if (e.target.closest('.list-actions')) return;
      const id = h.dataset.list;
      const currently = state.expandedLists[id] !== false;
      state.expandedLists[id] = !currently;
      save(); renderMain();
    };
  });
  content.querySelectorAll('.checkbox').forEach(cb => {
    cb.onchange = () => { if (cb.checked) removeTask(cb.dataset.id); };
  });
  content.querySelectorAll('[data-add]').forEach(b => {
    b.onclick = (e) => { e.stopPropagation(); createTask(b.dataset.add); };
  });
  content.querySelectorAll('[data-move]').forEach(b => {
    b.onclick = (e) => { e.stopPropagation(); moveTask(b.dataset.move); };
  });
  content.querySelectorAll('[data-del]').forEach(b => {
    b.onclick = (e) => { e.stopPropagation(); if (confirm('Delete this task?')) removeTask(b.dataset.del); };
  });
  content.querySelectorAll('[data-movelist]').forEach(b => {
    b.onclick = (e) => { e.stopPropagation(); moveList(b.dataset.movelist); };
  });
  content.querySelectorAll('[data-dellist]').forEach(b => {
    b.onclick = (e) => { e.stopPropagation(); deleteList(b.dataset.dellist); };
  });
}

function render() {
  renderFolders();
  renderMain();
  document.querySelectorAll('.filters button').forEach(b => {
    b.classList.toggle('active', b.dataset.filter === state.filter);
  });
  document.getElementById('sortSelect').value = state.sort;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&','<':'<','>':'>','"':'"',"'":'&#39;'}[c]));
}

document.getElementById('importBtn').onclick = () => document.getElementById('fileInput').click();
document.getElementById('fileInput').onchange = (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => importTickTick(reader.result);
  reader.readAsText(file);
  e.target.value = '';
};
document.getElementById('exportBtn').onclick = exportCSV;
document.getElementById('clearBtn').onclick = () => {
  if (confirm('Clear all local data? This cannot be undone.')) {
    state = { folders: [], currentFolderId: null, filter: 'all', sort: 'date', expandedLists: {} };
    save(); render();
  }
};
document.getElementById('newFolderBtn').onclick = createFolder;
document.getElementById('newListBtn').onclick = createList;
document.querySelectorAll('.filters button').forEach(b => {
  b.onclick = () => { state.filter = b.dataset.filter; save(); render(); };
});
document.getElementById('sortSelect').onchange = (e) => {
  state.sort = e.target.value; save(); render();
};

load().then(() => render());
</script>
</body>
</html>
